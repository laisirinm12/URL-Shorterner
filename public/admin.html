<!DOCTYPE html>
<html>

<head>

    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="admin.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="dashboard">

        <h1>URL Dashboard</h1>
        <h3>Link History & Analytics</h3>

        <div class="toolbar">

            <a href="index.html">
                <button class="home-btn">Back to Home</button>
            </a>

            <input id="searchInput" placeholder="Search short code...">

        </div>

        <div class="stats">

            <div class="stat-card">
                <h3 id="totalLinks">0</h3>
                <p>Total Links</p>
            </div>

            <div class="stat-card">
                <h3 id="totalClicks">0</h3>
                <p>Total Clicks</p>
            </div>

            <div class="stat-card">
                <h3 id="activeLinks">0</h3>
                <p>Active Links</p>
            </div>

        </div>
        <h2>Top Clicked Links</h2>

        <div class="chart-card">
            <canvas id="clickChart"></canvas>
        </div>

        <div id="loadingSpinner" class="spinner"></div>
        <div class="table-card">

            <table>

                <thead>
                    <tr>
                        <th>Short Code</th>
                        <th>Original URL</th>
                        <th id="sortClicks">Clicks</th>
                        <th>Expires In</th>
                        <th>Delete</th>
                    </tr>
                </thead>

                <tbody id="tableBody"></tbody>

            </table>

        </div>

    </div>

    <script src="admin.js"></script>

</body>

</html>
